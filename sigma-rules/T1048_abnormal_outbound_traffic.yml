title: Abnormal Outbound Connection Volume
id: a7b8c9d0-e1f2-3456-abcd-567890123456
status: experimental
description: Detects abnormally high outbound connection count from a single internal host to a specific destination port — consistent with T1048 Exfiltration over Alternative Protocol or C2 beaconing behavior.
references:
    - https://attack.mitre.org/techniques/T1048/
author: Yushen Chen
date: 2026/05/25
tags:
    - attack.exfiltration
    - attack.t1048
    - attack.command_and_control
logsource:
    product: windows
    service: firewall
detection:
    selection:
        protocol: TCP
    filter:
        dst_port:
            - 80
            - 443
    condition: selection and not filter
falsepositives:
    - Authorized backup or sync software
    - Software update mechanisms
    - Monitoring tools with high poll frequency
level: medium